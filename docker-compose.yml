services:
  apk-kie-api:
    build:
      context: ./backend
    container_name: apk-kie-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - apk_kie_data:/data/apk-kie
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

volumes:
  apk_kie_data:
